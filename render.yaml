# Render blueprint for the FinePrint backend.
#
# One web service running FastAPI. It serves everything the frontend needs:
# lender search, CFPB Safety Labels, and the household financial context model.
# Streamlit is deliberately not deployed -- see the "Streamlit" section of the
# README.
#
# Before the first deploy, set FINEPRINT_ALLOWED_ORIGINS to the deployed
# frontend origin (Render will prompt; it is left unset here rather than guessed).
# Nothing in this service needs a secret or an API key.

services:
  - type: web
    name: fineprint-api
    runtime: python
    rootDir: backend

    envVars:
      # The model artifact was built and verified against Python 3.12 with
      # numpy<2 and xgboost 2.0.3. Pinning it here keeps a surprise upgrade from
      # changing a number consumers have already seen.
      - key: PYTHON_VERSION
        value: "3.12.4"

      # Comma-separated browser origins allowed by CORS. Set this to the
      # deployed Vercel URL, e.g. https://your-app.vercel.app. Left for the
      # deployer rather than guessed, so no invented hostname lands in the repo.
      - key: FINEPRINT_ALLOWED_ORIGINS
        sync: false

    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    plan: free
